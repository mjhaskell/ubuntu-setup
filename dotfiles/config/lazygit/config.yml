nerdFontsVersion: "3"
git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --hyperlinks --line-numbers
      name: delta 1-col
    - command: delta --{{colorScheme}} --paging=never --color-only
      name: delta color-only
    - command: delta --{{colorScheme}} --paging=never --hyperlinks --line-numbers --side-by-side
      name: delta 2-col
